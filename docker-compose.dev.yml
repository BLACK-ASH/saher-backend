# Local dev/test dependencies only — production deploy uses the server-side compose.
services:
  mongo:
    image: mongo:7
    # Replica-set mode: mongoose transactions (seeds) require it, single-node rs is enough locally.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --quiet --eval "try { rs.status().ok } catch { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }"
      interval: 5s
      timeout: 15s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  mongo-data:
