# Reference production topology — nginx + Next.js frontend + backend + BullMQ worker.
# The server-side compose at /home/saher/Test/docker-compose.yml should mirror this file.
# mongo/redis are provided by the server compose (see docker-compose.dev.yml for local dev).
services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  frontend:
    # Next.js app image from the frontend repo (standalone output, port 3000)
    image: saher-frontend:latest
    expose:
      - '3000'

  backend:
    build: ..
    env_file: ../.env
    expose:
      - '4000'
    volumes:
      # temp export artifacts (PDF/Excel reports) survive container restarts and
      # are shared with the worker, which writes them
      - temp-files:/app/public/temp
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: ..
    command: pnpm start:worker
    env_file: ../.env
    volumes:
      - temp-files:/app/public/temp

volumes:
  temp-files:
