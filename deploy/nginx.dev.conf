# Saher DEV reverse proxy — same port 80 as prod; run one stack at a time.
# Points at the host-run dev servers (pnpm dev: API :4000, Next :3000).
# Run nginx with network_mode: host so 127.0.0.1 reaches them.
#
# Deliberately looser rate limits than prod so manual dev/testing isn't throttled.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=100r/s;

# Same uuid-immutable uploads as prod, shorter cache window for dev churn.
proxy_cache_path /var/cache/nginx/uploads keys_zone=cache_uploads:10m max_size=256m inactive=1d;

upstream saher_backend {
    server 127.0.0.1:4000;
}

upstream saher_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;
    limit_req_status 429;

    # Security headers. NOTE: nginx does not inherit `add_header` into a location
    # that sets its own — so these are repeated below in the /uploads/ and
    # /saher-logo.png locations alongside `X-Cache-Status`.
    # Add Strict-Transport-Security here if this nginx ever terminates TLS.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Backend API
    location /api/ {
        limit_req zone=api_limit burst=200 nodelay;
        proxy_pass http://saher_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /api/auth/login {
        limit_req zone=auth_limit burst=30 nodelay;
        proxy_pass http://saher_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/refresh-token {
        limit_req zone=auth_limit burst=30 nodelay;
        proxy_pass http://saher_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/upload/ {
        limit_req zone=upload_limit burst=100 nodelay;
        proxy_pass http://saher_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Generated docs (Redoc) served by the backend from <cwd>/docs
    location /docs {
        proxy_pass http://saher_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Temp export downloads — not cached, filenames change per export.
    location /temp/ {
        proxy_pass http://saher_backend;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://saher_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache cache_uploads;
        proxy_cache_key "$host$uri";
        proxy_cache_valid 200 301 1d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires 1d;
    }
    location /saher-logo.png {
        proxy_pass http://saher_backend;
        proxy_set_header Host $host;
        proxy_cache cache_uploads;
        proxy_cache_valid 200 1d;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires 1d;
    }

    # Next.js frontend (catch-all)
    location / {
        proxy_pass http://saher_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}