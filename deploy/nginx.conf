# Saher production reverse proxy:
#   /api, /docs, statics  -> backend (:4000)
#   everything else       -> Next.js frontend (:3000)
upstream saher_backend {
    server backend:4000;
}

upstream saher_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # uploads (multer memory stream) — size to your largest allowed document
    client_max_body_size 25m;

    # Backend API
    location /api/ {
        proxy_pass http://saher_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # long-running report exports / slow queries
        proxy_read_timeout 120s;
    }

    # Generated docs (Redoc) served by the backend from <cwd>/docs
    location /docs {
        proxy_pass http://saher_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Temp export downloads + public assets served by the backend from <cwd>/public
    location /temp/ {
        proxy_pass http://saher_backend;
        proxy_set_header Host $host;
    }
    location /uploads/ {
        proxy_pass http://saher_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /saher-logo.png {
        proxy_pass http://saher_backend;
        proxy_set_header Host $host;
    }

    # Next.js frontend (catch-all)
    location / {
        proxy_pass http://saher_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
