allOf:
  - $ref: './envelope.yaml'
  - type: object
    properties:
      data:
        type: object
        properties:
          id:
            type: string
          user:
            type: string
          leaveType:
            type: string
          startDate:
            type: string
            format: date
          endDate:
            type: string
            format: date
          status:
            type: string
            enum: [pending, approved, rejected]
