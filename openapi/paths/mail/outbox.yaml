get:
  tags: [Mail]
  summary: Get outbox mail
  operationId: getOutboxMail
  parameters:
    - name: page
      in: query
      required: false
      schema: { type: integer, default: 1 }
    - name: limit
      in: query
      required: false
      schema: { type: integer, default: 10 }
  responses:
    '200':
      description: Outbox mail list
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/mail-response.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
