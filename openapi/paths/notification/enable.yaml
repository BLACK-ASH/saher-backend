post:
  tags: [Notification]
  summary: Enable web push notifications
  operationId: enablePush
  responses:
    '200':
      description: Web push enabled
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/notification-response.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
