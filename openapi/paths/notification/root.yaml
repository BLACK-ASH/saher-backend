get:
  tags: [Notification]
  summary: List all notifications
  operationId: listNotifications
  parameters:
    - name: page
      in: query
      required: false
      schema: { type: integer, default: 1 }
    - name: limit
      in: query
      required: false
      schema: { type: integer, default: 10 }
  responses:
    '200':
      description: Notifications retrieved
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/notification-response.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
post:
  tags: [Notification]
  summary: Broadcast notification
  operationId: createNotification
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            title: { type: string }
            description: { type: string }
  responses:
    '201':
      description: Notification created
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/notification-response.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
