put:
  tags: [Leave]
  summary: Review leave application
  operationId: reviewLeave
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            status: { type: string, enum: [approved, rejected] }
            reviewComment: { type: string }
  responses:
    '200':
      description: Application reviewed
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/leave-response.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
