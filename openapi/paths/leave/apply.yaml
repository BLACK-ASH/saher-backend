post:
  tags: [Leave]
  summary: Apply for leave
  operationId: applyLeave
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            type: { type: string }
            startDate: { type: string, format: date }
            endDate: { type: string, format: date }
            reason: { type: string }
  responses:
    '201':
      description: Leave application submitted
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/leave-response.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
