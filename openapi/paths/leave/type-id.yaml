put:
  tags: [Leave]
  summary: Update leave type
  operationId: updateLeaveType
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name: { type: string }
  responses:
    '200':
      description: Leave type updated
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/leave-response.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
