post:
  tags:
    - Upload
  summary: Upload a document
  operationId: uploadDocument
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - document
            - name
          properties:
            document:
              type: string
              format: binary
              description: Document file to upload (pdf, doc, docx, ppt, pptx, xls, xlsx — max 10 MB)
            name:
              type: string
              description: Alt text / display name for the document
              example: Project report
  responses:
    '201':
      description: Document uploaded successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Document Upload Successfully
              data:
                type: object
                properties:
                  id:
                    type: string
                    example: 6988338c67ea81cf41fb4d9f
                  fileName:
                    type: string
                    example: b1e5007d-eee0-461f-a22b-445fc1544a24.pdf
                  alt:
                    type: string
                    example: Project report
                  src:
                    type: string
                    example: /uploads/documents/b1e5007d-eee0-461f-a22b-445fc1544a24.pdf
                  size:
                    type: integer
                    example: 204800
                  mimetype:
                    type: string
                    example: application/pdf
    '400':
      description: Invalid Request
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml

    '500':
      $ref: ../../components/common/internal-server-error.yaml
    '413':
      description: File Too Large (images 5 MB, documents 10 MB per file)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: File Too Large.
