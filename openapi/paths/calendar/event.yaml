post:
  tags: [Calendar]
  summary: Create calendar event
  operationId: createCalendarEvent
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            title: { type: string }
            date: { type: string, format: date-time }
  responses:
    '201':
      description: Event created
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/calendar-response.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
