post:
  tags: [Payroll]
  summary: Approve a payroll record
  operationId: approvePayroll
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    '200':
      description: Payroll approved
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payroll-response.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
