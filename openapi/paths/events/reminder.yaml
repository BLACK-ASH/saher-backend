get:
  tags: [Events]
  summary: Send Session Reminder To Speaker
  operationId: sendSessionReminder
  description: Pushes a reminder notification to the session's speaker(s).
  parameters:
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Reminder sent
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/envelope.yaml
    '400':
      description: Session Not Found / No Speakers
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
