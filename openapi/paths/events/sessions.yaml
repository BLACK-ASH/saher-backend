get:
  tags: [Events]
  summary: List Sessions
  operationId: listSessions
  description: Keyword matches session title/description text index, workshop titles, or program titles.
  parameters:
    - name: keyword
      in: query
      schema:
        type: string
    - name: isDeleted
      in: query
      schema:
        type: boolean
        default: false
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: limit
      in: query
      schema:
        type: integer
        default: 10
  responses:
    '200':
      description: Sessions list
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/envelope.yaml
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/session.yaml
                  meta:
                    $ref: ../../components/schemas/meta-pagination.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
