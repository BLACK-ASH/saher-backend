get:
  tags: [Events]
  summary: List Workshops
  operationId: listWorkshops
  parameters:
    - name: keyword
      in: query
      schema:
        type: string
      description: Matches workshop title/description or program titles
    - name: isDeleted
      in: query
      schema:
        type: boolean
        default: false
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: limit
      in: query
      schema:
        type: integer
        default: 10
  responses:
    '200':
      description: Workshops list
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/envelope.yaml
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/workshop.yaml
                  meta:
                    $ref: ../../components/schemas/meta-pagination.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
