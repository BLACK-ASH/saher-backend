get:
  tags: [Attendance]
  summary: Get Own Today's Attendance
  operationId: getMyTodayAttendance
  responses:
    '200':
      description: Today's attendance for the caller
      content:
        application/json:
          schema:
            $ref: ../../components/common/succes-response.yaml
    '400':
      description: Invalid Details
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml

    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
