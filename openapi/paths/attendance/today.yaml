get:
  tags: [Attendance]
  summary: List Today's Attendance (admin/manager)
  operationId: listTodayAttendance
  parameters:
    - name: page
      in: query
      schema: { type: integer, default: 1 }
    - name: limit
      in: query
      schema: { type: integer, default: 10 }
  responses:
    '200':
      description: Paginated attendance rows for today
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/envelope.yaml
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/attendance-record.yaml
                  meta:
                    $ref: ../../components/schemas/meta-pagination.yaml
    '400':
      description: Invalid Details
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml

    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
