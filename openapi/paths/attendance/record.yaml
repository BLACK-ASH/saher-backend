get:
  tags: [Attendance]
  summary: Get One Attendance Record By Id
  operationId: getAttendanceRecordById
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    '200':
      description: Single attendance record
      content:
        application/json:
          schema:
            $ref: ../../components/common/succes-response.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml

    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
