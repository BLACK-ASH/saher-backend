get:
  tags: [Attendance]
  summary: Retrieve Attendance Ranged (self or admin)
  operationId: retrieveAttendanceRanged
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string }
      description: User id or the literal 'me'
    - name: type
      in: query
      schema: { type: string, enum: [week, month, year] }
      description: Either type or both startDate and endDate are required
    - name: startDate
      in: query
      schema: { type: string, format: date }
    - name: endDate
      in: query
      schema: { type: string, format: date }
    - name: page
      in: query
      schema: { type: integer, default: 1 }
    - name: limit
      in: query
      schema: { type: integer, default: 10 }
    - name: sort
      in: query
      schema: { type: string, enum: [asc, desc] }
  responses:
    '200':
      description: Ranged attendance records
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/envelope.yaml
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/attendance-record.yaml
                  meta:
                    $ref: ../../components/schemas/meta-pagination.yaml
    '400':
      description: Invalid Details
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml

    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/common/error-response.yaml
