post:
  tags: [Attendance]
  summary: Request An Attendance Correction
  operationId: createAttendanceCorrection
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [attendanceId, message, inTime, outTime]
          properties:
            attendanceId:
              type: string
            message:
              type: string
              minLength: 3
              maxLength: 300
            inTime:
              type: string
              format: date-time
            outTime:
              type: string
              format: date-time
            proof:
              type: string
              description: Media upload reference
  responses:
    '200':
      description: Correction request created
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../../components/schemas/envelope.yaml
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        enum: [pending, on-hold, approve, reject]
                      message:
                        type: string

    '400':
      description: Invalid Details
      content:
        application/json:
          schema:
            $ref: ../../../components/common/error-response.yaml

    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../../../components/common/error-response.yaml

    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../../../components/common/error-response.yaml

    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../../components/common/error-response.yaml
