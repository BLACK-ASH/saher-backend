name: Deploy Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    concurrency:
      group: deploy-dev
      cancel-in-progress: true

    steps:
      - name: Dev Deploy app
        run: |
          cd /home/deploy/saher/saher-backend
          git fetch origin
          git reset --hard origin/dev

          cd /home/deploy/saher
          docker compose up -d --build backend
      - name: Verify containers
        run: docker ps
