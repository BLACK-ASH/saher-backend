name: Deploy Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    concurrency:
      group: deploy-dev
      cancel-in-progress: true

    steps:
      - name: Dev Deploy app
        run: |
          cd /home/saher/Test/saher-backend
          git fetch origin
          git reset --hard origin/main

          cd /home/saher/Test/
          # worker must be rebuilt too — stale worker ships old job handlers otherwise
          docker compose up -d --build backend worker

      - name: Cleanup old images
        run: docker image prune -a

      - name: Verify containers
        run: docker ps
